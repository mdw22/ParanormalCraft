name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Compile common against vanilla alone first, so a loader import in common fails the build
      # even though the loader projects compile the common sources too.
      - name: Compile common on its own
        run: ./gradlew :common:compileJava

      - name: Build (includes common unit tests)
        run: ./gradlew build

      - name: Server GameTests (NeoForge and Fabric)
        run: ./gradlew :neoforge:runGameTestServer :fabric:runGameTest

      # Renders a real client under a virtual display with software OpenGL.
      - name: Fabric client GameTests (xvfb)
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric:runClientGameTest

      - name: Upload client GameTest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-gametest-screenshots
          path: fabric/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: paranormalcraft-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-javadoc.jar

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: paranormalcraft-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-javadoc.jar
