plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava(project(path: ':common', configuration: 'commonJava'))
    commonResources(project(path: ':common', configuration: 'commonResources'))
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources) {
        // Data generator hash cache, written next to the generated files in common.
        exclude('.cache/**')
    }
}

// Dev server: accept the EULA and run in offline mode so dev clients can join over localhost.
def prepareDevServer = tasks.register('prepareDevServer') {
    group = 'multiloader'
    description = 'Accepts the EULA, sets online-mode=false and copies tools/scripts into runs/server/paranormalcraft-scripts.'
    def serverDir = file('runs/server')
    def scriptsSource = rootProject.file('tools/scripts')
    doLast {
        def scriptsTarget = new File(serverDir, 'paranormalcraft-scripts')
        scriptsTarget.mkdirs()
        scriptsSource.listFiles()?.findAll { it.name.endsWith('.txt') }?.each { script ->
            new File(scriptsTarget, script.name).bytes = script.bytes
        }
        serverDir.mkdirs()
        new File(serverDir, 'eula.txt').text = 'eula=true\n'
        def props = new File(serverDir, 'server.properties')
        def lines = props.exists() ? props.readLines().findAll { !it.startsWith('online-mode=') } : []
        lines << 'online-mode=false'
        props.text = lines.join('\n') + '\n'
    }
}
tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn(prepareDevServer)
}

// Dev clients: seed options.txt so automated visual testing gets a fixed, distraction-free window.
// Only these keys are set; every other option is left as the game wrote it. Dev run folders only; nothing is shipped.
def automationOptions = [
        'pauseOnLostFocus'      : 'false',
        'fullscreen'            : 'false',
        'overrideWidth'         : '1280',
        'overrideHeight'        : '720',
        'guiScale'              : '2',
        'onboardAccessibility'  : 'false',
        'tutorialStep'          : 'none',
        'skipMultiplayerWarning': 'true',
        'joinedFirstServer'     : 'true',
]
['client', 'client2'].each { runName ->
    def taskSuffix = runName.capitalize()
    def seedTask = tasks.register("seed${taskSuffix}Options") {
        group = 'multiloader'
        description = "Writes the automation options into runs/${runName}/options.txt."
        def optionsFile = file("runs/${runName}/options.txt")
        doLast {
            optionsFile.parentFile.mkdirs()
            def lines = optionsFile.exists() ? optionsFile.readLines().findAll { line -> !automationOptions.containsKey(line.split(':', 2)[0]) } : []
            automationOptions.each { key, value -> lines << "${key}:${value}" }
            optionsFile.text = lines.join('\n') + '\n'
        }
    }
    tasks.matching { it.name == "run${taskSuffix}" }.configureEach {
        dependsOn(seedTask)
    }
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
