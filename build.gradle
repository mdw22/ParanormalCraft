plugins {
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    id 'net.fabricmc.fabric-loom' version '1.16.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
// Frees disk space in the dev run folders: deletes logs, crash reports, paranormalcraft-debug/ dumps, debug traces and
// shots, client worlds (saves/), the GameTest server world and every server world except the one named in
// server.properties. Keeps config files, options.txt and everything else. Paths are resolved at configuration time
// and deleted with plain file operations, so the task works with the configuration cache.
tasks.register('cleanDevRuns') {
    group = 'paranormalcraft'
    description = 'Deletes old test worlds, logs, crash reports and debug dumps from the dev run folders.'
    def root = rootDir
    def runRoots = ['neoforge/runs', 'fabric/runs'].collect { new File(rootDir, it) }
    doLast {
        def deleted = []
        def remove = { File target ->
            if (target.exists()) {
                if (target.isDirectory()) {
                    target.deleteDir()
                } else {
                    target.delete()
                }
                deleted << root.toPath().relativize(target.toPath()).toString()
            }
        }
        runRoots.findAll { it.isDirectory() }.collectMany { it.listFiles().findAll { it.isDirectory() } as List }.each { File run ->
            ['logs', 'crash-reports', 'paranormalcraft-debug', 'paranormalcraft-trace', 'paranormalcraft-shots', 'gametestserver'].each { remove(new File(run, it)) }
            def saves = new File(run, 'saves')
            if (saves.isDirectory()) {
                saves.listFiles().findAll { it.isDirectory() }.each { remove(it) }
            }
            def keep = null
            def properties = new File(run, 'server.properties')
            if (properties.isFile()) {
                def props = new Properties()
                properties.withInputStream { props.load(it) }
                keep = props.getProperty('level-name', 'world')
            }
            run.listFiles().findAll { it.isDirectory() && new File(it, 'level.dat').isFile() && it.name != keep }.each { remove(it) }
        }
        println(deleted ? "Deleted:\n  ${deleted.join('\n  ')}" : 'Nothing to delete.')
    }
}
