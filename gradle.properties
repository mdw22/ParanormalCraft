# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.0
group=io.github.mdw22.paranormalcraft
java_version=25

# Common
minecraft_version=26.2
mod_name=Paranormal Craft
mod_author=mdw22
mod_id=paranormalcraft
license=All Rights Reserved
credits=Built from the MultiLoader Template by Jared
description=Hunt, capture and contain the paranormal.
minecraft_version_range=[26.2, 26.3)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.161.0+26.2
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.93
neoforge_loader_version_range=[4,)

# GeckoLib, see https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/com/geckolib/ for new versions
# 5.5.6 exists for NeoForge/common but not Fabric; keep all three on the same version.
geckolib_version=5.5.5

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
